{{- if .Values.route.peering.enabled }}
{{- $route := .Values.route.peering }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}-peering
  namespace: "{{ .Release.Namespace }}"
spec:
  parentRefs:
    - name: mp-peering
      namespace: istio-system
      sectionName: https-peering
  hostnames:
    - {{ include "get-peering-hostname" . }}
  rules:
    - matches:
      {{- if $route.paths.allowAll }}
        - path:
            type: PathPrefix
            value: /
      {{- else }}
        {{- if and (not $route.paths.prefixes) (not $route.paths.exact) }}
          {{ fail "If you enable a route, you must explicitly define which paths & prefixes should be served (or allowAll: true)!" }}
        {{- end }}
      {{- range $prefix := $route.paths.prefixes }}
        {{- if eq $prefix "/" }}
        {{ fail "Prefixes may not contain /, please set allowAll: true explicitly!" }}
        {{- end }}
        - path:
            type: PathPrefix
            value: {{ $prefix }}
      {{- end }}
      {{- range $exact := $route.paths.exact }}
        - path:
            type: Exact
            value: {{ $exact }}
      {{- end }}
      {{- end }}
      backendRefs:
        - name: {{ .Release.Name }}
          port: 80
{{- end }}
