image:
  repository: docker.pkg.github.com/my-company/myservice
  tag: "1.30.7"
envName: staging

platform:
  spring:
    enabled: true
    env:
      datasourceFromSecretWithRLS: "rds/myservice"
      rabbitMQSecret: true
      deprecatedOAuth2PublicKey_PleaseMigrateToJWKS: true

sentry:
  enabled: false

routing:
  clusterDomain: "mycompany.tld"
route:
  public:
    enabled: true
    hostnames:
      - "$clusterDomain"
      - "myservice.othercompany.tld"
    paths:
      prefixes:
        - /api/v1/public
      exact:
        - /welcome
        - /index.html
    authorization:
      - type: oauth2
    replaceErrorPageOnStatus: ["404", "502"]
    extraCspDomains:
      - https://microfrontends.mycompany.tld
      - https://other-partner.tld

deployment:
  replicaCount: 5

podConfiguration:
  env:
    copyOwnExternalBaseURLIn: "SERVICE_MYSERVICE_BASE_URL"

  resources:
    memory: 1000Mi
    cpu:
      guarantee: 500m

  enableServiceLinks: false
  securityContext:
    runAsUser: 1000
    seccompProfile:
      type: RuntimeDefault

serviceAccount:
  enabled: true
awsAccountId: "1234567890"

logging:
  retention: verbose

disruptionBudget:
  type: minAvailable
  value: "50%"

extraManifests:
  - apiVersion: v1
    kind: ConfigMap
    metadata:
      labels:
        name: myservice-extra
    data:
      extra-data: "value"

prometheus:
  alertingRules:
    HighLatency:
      expr: avg(service_latency[5m]) > 2
      for: 5m
      description: Service MyService is slower than 200ms
      playbook_url: http://xconfluence/x/aBcDeFg
      severity: warning
    ServiceDown:
      expr: up{job="myservice"} == 0
      description: Service MyService is down
      playbook_url: http://xconfluence/x/aBcDeFg
      extraLabels:
        some_label: Some Value
      extraAnnotations:
        pint: pint disable promql/series(pint_problem)
    NoisyBaseAlert:
      expr: and absent(myservice_up)
      description: Service MyService is noisy
      playbook_url: http://xconfluence/x/aBcDeFg
