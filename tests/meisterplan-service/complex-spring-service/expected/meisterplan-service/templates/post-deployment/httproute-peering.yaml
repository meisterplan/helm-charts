---
# Source: meisterplan-service/templates/post-deployment/httproute-peering.yaml
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: myservice-peering
  namespace: "team-supercool"
spec:
  parentRefs:
    - name: mp-peering
      namespace: istio-system
      sectionName: https-peering
  hostnames:
    - myservice.peering.mycompany.tld
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/peerings/
        - path:
            type: Exact
            value: /api/v1/complexity
      backendRefs:
        - name: myservice
          port: 80

